<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Slides</title>

<style>
  body {
    margin: 0;
    background: #0d1f14;
    color: white;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    width: 100vw;
    height: 100vh;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3vh 3vw;
    box-sizing: border-box;
  }

  .active {
    opacity: 1;
  }

  .panel {
    width: 100%;
    height: 100%;
    background: #11291c;
    border-radius: 40px;
    border: 6px solid;
    border-image: linear-gradient(45deg, #00ffbf, #00cc99, #00ffbf) 1;
    box-shadow:
      0 0 25px rgba(0,255,180,0.4),
      inset 0 0 20px rgba(0,0,0,0.7);
    padding: 4vh 4vw;
    box-sizing: border-box;
  }

  .logo {
    height: 22vh;
    margin-bottom: 3vh;
  }

  .hours-title {
    font-size: 9vh;
    font-weight: 900;
    text-align: center;
    margin-bottom: 3vh;
    color: #7fffd4;
    text-shadow: 0 0 25px #4fd0a0;
  }

  .hours-table {
    width: 55vw;
    margin: 0 auto;
  }

  .hours-row {
    display: flex;
    justify-content: space-between;
    font-size: 5vh;
    margin-bottom: 2vh;
  }

  .hours-day {
    font-weight: 700;
  }

  .hours-time {
    font-weight: 900;
    color: #7fffd4;
  }

  .content-slide {
    display: flex;
    flex-direction: row;
    gap: 4vw;
  }

  .text-box {
    width: 66%;
    font-size: 3.8vh;
    line-height: 1.4;
    max-height: 80vh;
    overflow: hidden;
    white-space: pre-line;
  }

  .photo-box {
    width: 33%;
    height: 80vh;
    background: #000;
    border-radius: 30px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;

    border: 4px solid;
    border-image: linear-gradient(45deg, #00ffbf, #00cc99, #00ffbf) 1;
    box-shadow:
      0 0 20px rgba(0,255,180,0.4),
      inset 0 0 20px rgba(0,0,0,0.7);
  }

  .slide-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>

</head>
<body>

<div id="slides"></div>

<script>
const MAIN_JSON = "main.json";
const OTHER_JSON = "slides.json";

async function loadSlides() {
    const main = await fetch(MAIN_JSON + "?nocache=" + Date.now()).then(r => r.json());
    const others = await fetch(OTHER_JSON + "?nocache=" + Date.now()).then(r => r.json());

    const slides = [];

    let hoursHtml = "";
    for (const key in main.hours) {
        const h = main.hours[key];
        hoursHtml += `
          <div class="hours-row">
            <span class="hours-day">${h.pl} / ${h.en} / ${h.nl}</span>
            <span class="hours-time">${h.time}</span>
          </div>
        `;
    }

    slides.push(`
      <div class="slide">
        <div class="panel">
          <img class="logo" src="logo.png">
          <div class="hours-title">Godziny otwarcia</div>
          <div class="hours-table">${hoursHtml}</div>
        </div>
      </div>
    `);

    others.slides.forEach(s => {
        slides.push(`
          <div class="slide">
            <div class="panel content-slide">
              <div class="text-box">${s.text}</div>
              <div class="photo-box">
                <img class="slide-photo" src="${s.image}">
              </div>
            </div>
          </div>
        `);
    });

    document.getElementById("slides").innerHTML = slides.join("");
    startSlideshow();
}

function startSlideshow() {
    const slideElements = document.querySelectorAll(".slide");
    let index = 0;

    function show() {
        slideElements.forEach(s => s.classList.remove("active"));
        slideElements[index].classList.add("active");
        index = (index + 1) % slideElements.length;
    }

    show();
    setInterval(show, 8000);
}

loadSlides();
</script>

</body>
</html>
