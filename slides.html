<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Slides</title>

<style>
  body {
    margin: 0;
    background: #0f1a15;
    color: white;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .active {
    opacity: 1;
  }

  /* PANEL – 10px od KAŻDEGO brzegu */
  .panel {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;

    background: #13231d;
    border-radius: 20px;
    overflow: hidden;

    border: 4px solid #00ffbf;
    box-shadow:
      0 0 20px rgba(0,255,180,0.4),
      inset 0 0 20px rgba(0,0,0,0.7);

    padding: 20px;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
  }

  /* ---------- PIERWSZY SLAJD: LOGO + GODZINY ---------- */

  .hours-layout {
    display: flex;
    flex-direction: row;
    height: 100%;
  }

  /* LEWA POŁOWA — LOGO */
  .hours-left {
    width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo {
    width: 60%; /* większe logo */
    animation: pulse 2.5s infinite ease-in-out;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.9; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* PRAWA POŁOWA — GODZINY */
  .hours-right {
    width: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .hours-title {
    font-size: 4.5vh; /* większa czcionka */
    font-weight: 900;
    text-align: center;
    margin-bottom: 2vh;
    color: #7fffd4;
    text-shadow: 0 0 20px #4fd0a0;
  }

  .hours-table {
    width: 80%;
  }

  .hours-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5vw;
    font-size: 3.5vh; /* większe godziny */
    margin-bottom: 0.4vh;
  }

  .hours-day {
    font-weight: 700;
  }

  .hours-time {
    font-weight: 900;
    color: #7fffd4;
  }

  /* ---------- SLAJD TEKST + OBRAZ ---------- */

  .content-slide {
    display: flex;
    flex-direction: row;
    gap: 2vw;
    align-items: center;
  }

  .text-box {
    width: 55%;
    font-size: 3vh;
    line-height: 1.3;
    max-height: 80vh;
    overflow: hidden;
    white-space: pre-line;
    opacity: 0;
    transform: translateX(-5vw);
  }

  .text-animate {
    animation: slideLeft 0.8s ease-out forwards;
  }

  @keyframes slideLeft {
    from { transform: translateX(-5vw); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .photo-box {
    width: 45%;
    height: 45vw;
    max-height: calc(100% - 20px);
    background: #000;

    border-radius: 20px;
    overflow: hidden;

    border: 4px solid #00ffbf;
    box-shadow:
      0 0 20px rgba(0,255,180,0.4),
      inset 0 0 20px rgba(0,0,0,0.7);

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;
    transform: translateX(5vw);
  }

  .photo-animate {
    animation: slideRight 0.8s ease-out forwards;
  }

  @keyframes slideRight {
    from { transform: translateX(5vw); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .slide-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>

</head>
<body>

<div id="slides"></div>

<script>
const MAIN_JSON = "main.json";
const OTHER_JSON = "slides.json";

async function loadSlides() {
    const main = await fetch(MAIN_JSON + "?nocache=" + Date.now()).then(r => r.json());
    const others = await fetch(OTHER_JSON + "?nocache=" + Date.now()).then(r => r.json());

    const slides = [];

    /* ---------- SLIDE GODZIN ---------- */
    let hoursHtml = "";
    for (const key in main.hours) {
        const h = main.hours[key];
        hoursHtml += `
          <div class="hours-row">
            <span class="hours-day">${h.pl} / ${h.en} / ${h.nl}</span>
            <span class="hours-time">${h.time}</span>
          </div>
        `;
    }

    slides.push(`
      <div class="slide">
        <div class="panel">
          <div class="hours-layout">
            <div class="hours-left">
              <img class="logo" src="logo.png">
            </div>
            <div class="hours-right">
              <div class="hours-title">Otwarte / Open / Geopend</div>
              <div class="hours-table">${hoursHtml}</div>
            </div>
          </div>
        </div>
      </div>
    `);

    /* ---------- POZOSTAŁE SLAJDY ---------- */
    others.slides.forEach(s => {
        slides.push(`
          <div class="slide">
            <div class="panel content-slide">
              <div class="text-box">${s.text}</div>
              <div class="photo-box">
                <img class="slide-photo" src="${s.image}">
              </div>
            </div>
          </div>
        `);
    });

    document.getElementById("slides").innerHTML = slides.join("");
    startSlideshow();
}

function startSlideshow() {
    const slideElements = document.querySelectorAll(".slide");
    let index = 0;

    function applyAnimations(slide) {
        const text = slide.querySelector('.text-box');
        const photo = slide.querySelector('.photo-box');

        if (text) {
            text.classList.remove('text-animate');
            void text.offsetWidth;
            text.classList.add('text-animate');
        }

        if (photo) {
            photo.classList.remove('photo-animate');
            void photo.offsetWidth;
            photo.classList.add('photo-animate');
        }
    }

    function show() {
        slideElements.forEach(s => s.classList.remove("active"));
        const current = slideElements[index];
        current.classList.add("active");
        applyAnimations(current);
        index = (index + 1) % slideElements.length;
    }

    show();
    setInterval(show, 8000);
}

loadSlides();
</script>

</body>
</html>
