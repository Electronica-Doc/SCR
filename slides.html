<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Slides</title>

<style>
  body {
    margin: 0;
    background: #0f1a15;
    color: white;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    width: 100vw;
    height: 100vh;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }

  .active {
    opacity: 1;
  }

  /* PANEL – 5% od każdej krawędzi, dla każdego slajdu */
  .panel {
    width: 90%;
    height: 90%;
    margin: 5%;
    background: #13231d;
    border-radius: 3vw;
    overflow: hidden;
    border: 0.6vw solid #00ffbf;
    box-shadow:
      0 0 2vw rgba(0,255,180,0.4),
      inset 0 0 2vw rgba(0,0,0,0.7);
    padding: 3vh 3vw;
    box-sizing: border-box;
  }

  /* LOGO */
  .logo {
    width: 30%;
    margin: 0 auto 2vh auto;
    display: block;
    animation: pulse 2.5s infinite ease-in-out;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.9; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* GODZINY */
  .hours-title {
    font-size: 3.5vh;
    font-weight: 900;
    text-align: center;
    margin-bottom: 2vh;
    color: #7fffd4;
    text-shadow: 0 0 2vw #4fd0a0;
  }

  .hours-table {
    width: 60%;
    margin: 0 auto;
  }

  .hours-row {
    display: flex;
    justify-content: center;      /* zamiast space-between */
    column-gap: 2vw;              /* mniejszy odstęp między nazwą a godziną */
    font-size: 3vh;               /* normalna, czytelna wielkość */
    margin-bottom: 0.8vh;
  }

  .hours-day {
    font-weight: 700;
  }

  .hours-time {
    font-weight: 900;
    color: #7fffd4;
  }

  /* SLAJD TEKST + OBRAZ */
  .content-slide {
    display: flex;
    flex-direction: row;
    gap: 3vw;
    height: 100%;
    align-items: center;
  }

  /* TEKST */
  .text-box {
    width: 60%;
    font-size: 3.2vh;
    line-height: 1.3;
    max-height: 80vh;
    overflow: hidden;
    white-space: pre-line;
    opacity: 0;
    transform: translateX(-5vw);
  }

  .text-animate {
    animation: slideLeft 0.8s ease-out forwards;
  }

  @keyframes slideLeft {
    from { transform: translateX(-5vw); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ZDJĘCIE – większy kwadrat, wyśrodkowany pionowo */
  .photo-box {
    width: 35%;
    height: 35vw;
    max-height: 70vh;
    background: #000;
    border-radius: 2vw;
    overflow: hidden;
    border: 0.4vw solid #00ffbf;
    box-shadow:
      0 0 2vw rgba(0,255,180,0.4),
      inset 0 0 2vw rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateX(5vw);
  }

  .photo-animate {
    animation: slideRight 0.8s ease-out forwards;
  }

  @keyframes slideRight {
    from { transform: translateX(5vw); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .slide-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>

</head>
<body>

<div id="slides"></div>

<script>
const MAIN_JSON = "main.json";
const OTHER_JSON = "slides.json";

async function loadSlides() {
    const main = await fetch(MAIN_JSON + "?nocache=" + Date.now()).then(r => r.json());
    const others = await fetch(OTHER_JSON + "?nocache=" + Date.now()).then(r => r.json());

    const slides = [];

    // ---------- SLIDE GODZIN ----------
    let hoursHtml = "";
    for (const key in main.hours) {
        const h = main.hours[key];
        hoursHtml += `
          <div class="hours-row">
            <span class="hours-day">${h.pl} / ${h.en} / ${h.nl}</span>
            <span class="hours-time">${h.time}</span>
          </div>
        `;
    }

    slides.push(`
      <div class="slide">
        <div class="panel">
          <img class="logo" src="logo.png">
          <div class="hours-title">Otwarte / Open / Geopend</div>
          <div class="hours-table">${hoursHtml}</div>
        </div>
      </div>
    `);

    // ---------- POZOSTAŁE SLAJDY ----------
    others.slides.forEach(s => {
        slides.push(`
          <div class="slide">
            <div class="panel content-slide">
              <div class="text-box">${s.text}</div>
              <div class="photo-box">
                <img class="slide-photo" src="${s.image}">
              </div>
            </div>
          </div>
        `);
    });

    document.getElementById("slides").innerHTML = slides.join("");
    startSlideshow();
}

function startSlideshow() {
    const slideElements = document.querySelectorAll(".slide");
    let index = 0;

    function applyAnimations(slide) {
        const text = slide.querySelector('.text-box');
        const photo = slide.querySelector('.photo-box');

        if (text && photo) {
            text.classList.remove('text-animate');
            photo.classList.remove('photo-animate');
            void text.offsetWidth;
            void photo.offsetWidth;
            text.classList.add('text-animate');
            photo.classList.add('photo-animate');
        }
    }

    function show() {
        slideElements.forEach(s => s.classList.remove("active"));
        const current = slideElements[index];
        current.classList.add("active");
        applyAnimations(current);
        index = (index + 1) % slideElements.length;
    }

    show();
    setInterval(show, 8000);
}

loadSlides();
</script>

</body>
</html>
